name: Terraform Infra Setup 

on:
  workflow_dispatch:
    inputs:
      do_plan:
        description: "Run terraform plan?"
        required: false
        default: "true"
        type: boolean
      do_apply:
        description: "Run terraform apply?"
        required: false
        default: "false"
        type: boolean
      do_destroy:
        description: "Run terraform destroy?"
        required: false
        default: "false"
        type: boolean
env:
  AWS_REGION: ap-south-1
permissions:
  id-token: write
  contents: write

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ap-south-1

      - name: Install  dependencies and create ZIP
        run: |
          zip lambda_function.zip lambda_function.py
          ls

      - name: Install Terraform Lint
        run: |
          wget https://github.com/terraform-linters/tflint/releases/download/v0.50.2/tflint_linux_amd64.zip
          unzip tflint_linux_amd64.zip
          sudo mv tflint /usr/local/bin/
          tflint --version

      - name: Install Checkov 
        run: |
          python -m pip install --upgrade pip
          pip install checkov

      - name: Run Checkov Static Analysis
        run: |
          checkov -d . --skip-path .github/* --skip-path k8s/*   --soft-fail

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Generate terraform docs
        uses: terraform-docs/gh-actions@main
        with:          
          working-dir: ./
          output-file: README.md
          output-method: inject
          git-push: "true"

      - name: Terraform Init
        run: | 
         terraform init
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format
        run: terraform fmt

      - name: Run Terraform Lint
        run: tflint --init
  
      - name: Terraform Plan
        if: ${{ github.event.inputs.do_plan == 'true' }}
        run: terraform plan 
  
      - name: Terraform Apply (manual)
        if: ${{ github.event_name == 'workflow_dispatch' &&  github.event.inputs.do_apply == 'true' }}
        run: terraform apply -auto-approve

      - name: Terraform destroy (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.do_destroy == 'true' }}
        run: terraform destroy -auto-approve 

      - name: Upload Terraform logs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-logs
          path: ./log.txt